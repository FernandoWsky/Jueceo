<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jueceo de resistencia</title>
<style>
:root{--ink:#f5f6f8;--paper:#16181d;--card:#21252e;--card2:#1e222b;--line:rgba(255,255,255,.08);--red:#e5484d;--mut:#8b90a0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);touch-action:manipulation}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(22,24,29,.92);color:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
header a{color:var(--ink);text-decoration:none;font-weight:700}
header a:first-child{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:.02em}
header nav{display:flex;gap:14px;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:24px 0 8px}
input,select,textarea,button{font:inherit;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);width:100%;margin:4px 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
input::placeholder,textarea::placeholder{color:#6b7280}
select option{background:#21252e}
button{background:#2b303d;color:var(--ink);border:1px solid rgba(255,255,255,.1);font-weight:700;cursor:pointer;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
button:active{transform:translateY(1px)}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.35)}
button.del{width:auto;background:none;color:var(--red);padding:4px 8px;margin:0;box-shadow:none;border:0}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
ul{list-style:none;padding:0;margin:8px 0}
li{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
li small{color:var(--mut);display:block}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.pub td{font-size:clamp(16px,2.4vw,28px)}
.pub td:last-child{color:var(--ink);font-weight:800}
.pub tr.first td{background:rgba(255,255,255,.07)}
.pub tr.first td:first-child{color:var(--ink)}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42vh;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:min(34vw,190px);line-height:1;border-radius:28px;margin:12px 0;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.tap small{font-size:20px;font-weight:500;margin-top:8px;color:var(--mut)}
.ej{font-size:26px;font-weight:700;margin-top:8px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.tm{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.nula{background:var(--red);border-color:var(--red);color:#fff}
#net{display:none;background:#21252e;color:var(--ink);text-align:center;padding:6px;font-size:14px;border-bottom:1px solid var(--line)}
body.off #net{display:block}
.sum{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px;margin:12px 0;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sum h3{margin:8px 0 0;font-size:26px;font-family:Georgia,"Times New Roman",serif}
.sum .sub{color:var(--mut);margin:2px 0 12px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line)}
.badge.cap{background:var(--red);border-color:var(--red);color:#fff}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kp div{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.kp b{display:block;font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.kp span{color:var(--mut);font-size:13px}
.kp .big{grid-column:1/-1;background:var(--card2);color:var(--ink)}
.kp .big b{font-size:44px}
.kp .big span{color:var(--mut)}
/* Pantalla del juez (#j): monocromo oscuro, estilo Alfred */
#j{--bg:#16181d;--card:#21252e;--card2:#1e222b;--line:rgba(255,255,255,.08);--ink:#f5f6f8;--mut:#8b90a0;--red:#e5484d;background:var(--bg);color:var(--ink);border-radius:24px;padding:20px 16px;margin:16px auto;box-shadow:0 12px 32px rgba(0,0,0,.35)}
#j h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:10px 0}
#j input,#j select{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#1e222b;color:var(--ink);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
#j input::placeholder{color:#6b7280}
#j select option{background:#21252e}
#j button{padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#2b303d;color:var(--ink);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#j button:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#j button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#j :focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
#j .meta{color:var(--mut)}
#j .meta span:first-child{color:var(--ink);font-weight:700}
#j .count{align-items:flex-end;margin-top:4px}
#j .count .tm{font-size:56px;line-height:1}
#j .count .tot{color:var(--ink);font-size:22px;font-weight:700}
#j .tm{font-size:44px;font-weight:800;color:var(--ink)}
#j .tap{min-height:44vh;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:min(38vw,220px);border-radius:28px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 12px 32px rgba(0,0,0,.35)}
#j .tap small{font-size:20px;font-weight:700;color:var(--mut)}
#j .tap:active{transform:translateY(3px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
#j .ej{font-size:30px;font-weight:800;margin-top:12px;color:var(--ink)}
#j .nula{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.25)}
#j .sum{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
#j .sum h3{margin:10px 0 0;font-size:26px;font-family:Georgia,"Times New Roman",serif}
#j .sum .sub{color:var(--mut);margin:2px 0 16px}
#j .badge{padding:4px 12px;border-radius:999px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line)}
#j .badge.cap{background:var(--red);border-color:var(--red);color:#fff}
#j .ring-wrap{display:flex;justify-content:center;margin:10px 0 4px}
#j .ring{width:190px;height:190px}
#j .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:11}
#j .ring-fg{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
#j .ring-num{fill:var(--ink);font-size:44px;font-weight:800;text-anchor:middle}
#j .ring-lbl{fill:var(--mut);font-size:13px;text-anchor:middle}
#j .kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
#j .kp div{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#j .kp b{display:block;font-size:30px;color:var(--ink)}
#j .kp span{color:var(--mut)}
#j .bars{margin:16px 0 4px}
#j .bar-row{margin:14px 0}
#j .bar-head{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
#j .bar-head b{font-weight:700}
#j .bar-head span{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
#j .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#j .bar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
/* Login: centrado, como la pantalla de Alfred */
.login{max-width:420px;padding-top:56px;text-align:center}
.login .medal{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 2px 10px rgba(255,255,255,.06)}
.login h2{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:0;text-transform:none;margin:8px 0 4px}
.login .wel{color:var(--mut);font-size:14px;margin:0 0 16px}
.login .err{min-height:20px}
@media print{header,button,#net{display:none}}
@media print{#j{background:#fff!important;color:#000!important;box-shadow:none}#j .sum,#j .kp div{background:#fff!important;color:#000!important;border-color:#ccc!important}#j .kp b{color:#000}#j .ring-num{fill:#000}#j .ring-fg{stroke:#000}}
.err{color:var(--red)}
</style>
</head>
<body>
<div id="net">Sin conexión: los toques se guardan y se envían al volver la señal.</div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtD=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');
let user=null,unsub=[];
const isAdmin=()=>user&&user.email===ADMIN_EMAIL;
const net=()=>document.body.classList.toggle('off',!navigator.onLine);
addEventListener('online',net);addEventListener('offline',net);net();

const nav=()=>`<header><a href="#/">Jueceo</a><nav>${user?'<a href="#/juez">Juzgar</a>':''}${isAdmin()?'<a href="#/admin">Admin</a>':''}<a href="#/publico">Marcador</a>${user?'<a href="#" id="out">Salir</a>':''}</nav></header>`;
const li=(t,s,c,id)=>`<li><span>${esc(t)}<small>${esc(s)}</small></span><button class="del" data-c="${c}" data-id="${id}">Borrar</button></li>`;
document.addEventListener('click',e=>{
  if(e.target.id==='out'){e.preventDefault();auth.signOut();}
  const d=e.target.dataset;
  if(d&&d.c&&confirm('¿Borrar?'))db.collection(d.c).doc(d.id).delete();
});

function datos(cb){
  const D={p:[],a:[],r:[]};
  [['pruebas','p'],['atletas','a'],['resultados','r']].forEach(([c,k])=>unsub.push(db.collection(c).onSnapshot(s=>{
    D[k]=s.docs.map(d=>({id:d.id,...d.data()}));
    D.p.sort((x,y)=>x.creado-y.creado);D.a.sort((x,y)=>x.nombre.localeCompare(y.nombre));cb(D);
  })));
  return D;
}
const rank=rs=>rs.slice().sort((a,b)=>b.reps-a.reps||(a.tiempo??1e9)-(b.tiempo??1e9));

auth.onAuthStateChanged(u=>{user=u;route();});
addEventListener('hashchange',route);
function route(){
  unsub.forEach(f=>f());unsub=[];
  const h=location.hash||'#/';
  if(h==='#/publico')return publico();
  if(!user)return login();
  if(h==='#/admin'&&isAdmin())return admin();
  if(h==='#/juez')return juez();
  location.hash=isAdmin()?'#/admin':'#/juez';
}

function login(){
  app.innerHTML=nav()+`<div class="wrap login"><div class="medal">J</div><h2>Jueceo</h2><p class="wel">Bienvenido, entra con tu cuenta de juez.</p><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button><p class="err" id="er"></p></div>`;
  $('#go').onclick=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>$('#er').textContent='Correo o contraseña incorrectos.');
}

function admin(){
  app.innerHTML=nav()+`<div class="wrap">
  <h2>Atletas</h2>
  <form id="fa" class="row"><input name="n" placeholder="Nombre" required><input name="c" placeholder="Categoría (ej. Varonil)"><button>Agregar</button></form>
  <ul id="la"></ul>
  <h2>Pruebas</h2>
  <form id="fp"><input name="n" placeholder="Nombre de la prueba" required><input name="m" type="number" min="0.5" step="0.5" placeholder="Time cap (minutos)" required>
  <textarea name="r" rows="6" placeholder="Rutina, un ejercicio por línea:&#10;Sentadillas 10&#10;Dominadas 5" required></textarea><button>Crear prueba</button></form>
  <ul id="lp"></ul></div>`;
  datos(D=>{
    $('#la').innerHTML=D.a.map(a=>li(a.nombre,a.cat||'Sin categoría','atletas',a.id)).join('')||'<li>Aún no hay atletas</li>';
    $('#lp').innerHTML=D.p.map(p=>li(p.nombre,'Cap '+fmt(p.cap)+' · '+p.rutina.map(e=>e.nombre+' '+e.reps).join(', '),'pruebas',p.id)).join('')||'<li>Aún no hay pruebas</li>';
  });
  $('#fa').onsubmit=e=>{e.preventDefault();const f=e.target;db.collection('atletas').add({nombre:f.n.value.trim(),cat:f.c.value.trim()});f.reset();};
  $('#fp').onsubmit=e=>{e.preventDefault();const f=e.target;
    const rutina=f.r.value.split('\n').map(l=>l.trim().match(/^(.+?)\s+(\d+)$/)).filter(Boolean).map(m=>({nombre:m[1],reps:+m[2]}));
    if(!rutina.length)return alert('Escribe cada ejercicio así: Sentadillas 10');
    db.collection('pruebas').add({nombre:f.n.value.trim(),cap:Math.round(f.m.value*60),rutina,creado:Date.now()});f.reset();};
}

function publico(){
  let sel='general',cat='',sig='';
  app.innerHTML=nav()+`<div class="wrap pub"><div class="row" id="f"></div><div id="t"></div></div>`;
  datos(D=>{
    const cats=[...new Set(D.a.map(a=>a.cat).filter(Boolean))];
    const s=JSON.stringify([D.p.map(p=>p.id),cats]);
    if(s!==sig){sig=s;
      $('#f').innerHTML=`<select id="sp"><option value="general">General (puntos)</option>${D.p.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select><select id="sc"><option value="">Todas las categorías</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
      $('#sp').value=sel;$('#sc').value=cat;
      $('#sp').onchange=e=>{sel=e.target.value;pinta(D)};$('#sc').onchange=e=>{cat=e.target.value;pinta(D)};
    }
    pinta(D);
  });
  function pinta(D){
    const rs=D.r.filter(r=>!cat||r.cat===cat);let h;
    const tp=p=>p.rutina.reduce((s,x)=>s+x.reps,0),sc=(r,p)=>Math.round(r.reps/tp(p)*1000)/10;
    if(sel==='general'){
      const m={};
      D.p.forEach(p=>rs.filter(r=>r.pruebaId===p.id).forEach(r=>{const o=m[r.atletaId]=m[r.atletaId]||{n:r.nombre,c:r.cat,t:0};o.t+=sc(r,p);}));
      const n=D.p.length||1;
      h='<tr><th>#</th><th>Atleta</th><th>Categoría</th><th>Puntaje</th></tr>'+Object.values(m).map(o=>({...o,t:Math.round(o.t/n*10)/10})).sort((a,b)=>b.t-a.t).map((o,i)=>`<tr${i===0?' class="first"':''}><td>${i+1}</td><td>${esc(o.n)}</td><td>${esc(o.c)}</td><td>${o.t}</td></tr>`).join('');
    }else{
      const p=D.p.find(x=>x.id===sel);
      h='<tr><th>#</th><th>Atleta</th><th>Reps</th><th>Tiempo</th><th>Nulas</th><th>Puntaje</th></tr>'+(p?rank(rs.filter(r=>r.pruebaId===sel)).map((r,i)=>`<tr${i===0?' class="first"':''}><td>${i+1}</td><td>${esc(r.nombre)}</td><td>${r.reps}</td><td>${r.done?fmtD(r.tiempo)+(r.completo?'':' (cap)'):'En curso'}</td><td>${r.nulas}</td><td>${sc(r,p)}</td></tr>`).join(''):'');
    }
    $('#t').innerHTML=`<table>${h}</table>`;
  }
}

function juez(){
  app.innerHTML=nav()+`<div class="wrap" id="j"></div>`;
  let S=null,iv=null,D;
  unsub.push(()=>clearInterval(iv));
  const tot=()=>S.p.rutina.reduce((s,x)=>s+x.reps,0);
  const snap=()=>({ej:S.ej,rep:S.rep,reps:S.reps,nulas:S.nulas,splits:S.splits.slice()});
  const guarda=()=>db.collection('resultados').doc(S.p.id+'_'+S.a.id).set({pruebaId:S.p.id,atletaId:S.a.id,nombre:S.a.nombre,cat:S.a.cat||'',reps:S.reps,nulas:S.nulas,ej:S.ej,rep:S.rep,t0:S.t0,done:S.done,completo:S.completo,tiempo:S.tiempo,upd:Date.now(),juez:S.juez||'',juezUid:user.uid,total:tot(),splits:S.splits,fin:S.fin||null});
  const opts=()=>{
    if(S)return;const sp=$('#sp'),sa=$('#sa');if(!sp)return;const a=sp.value,b=sa.value;
    sp.innerHTML=D.p.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
    sa.innerHTML=D.a.map(x=>`<option value="${x.id}">${esc(x.nombre)} ${esc(x.cat||'')}</option>`).join('');
    sp.value=a;sa.value=b;
  };
  const setup=()=>{$('#j').innerHTML=`<h2>Nuevo conteo</h2>${user.displayName?`<p>Juez: ${esc(user.displayName)}</p>`:'<input id="jn" placeholder="Tu nombre (juez)">'}<select id="sp"></select><select id="sa"></select><button id="pre">Preparar</button>`;opts();$('#pre').onclick=prep;};
  const prep=()=>{
    const p=D.p.find(x=>x.id===$('#sp').value),a=D.a.find(x=>x.id===$('#sa').value);if(!p||!a)return;
    const r=D.r.find(x=>x.id===p.id+'_'+a.id);
    let jn=user.displayName;if(!jn){jn=($('#jn')?.value||'').trim();if(!jn)return alert('Escribe tu nombre de juez.');user.updateProfile({displayName:jn});}
    S={p,a,ej:0,rep:0,reps:0,nulas:0,t0:null,done:false,completo:false,tiempo:null,hist:[],splits:[],juez:jn,fin:null};
    if(r)Object.assign(S,{ej:r.ej,rep:r.rep,reps:r.reps,nulas:r.nulas,t0:r.t0,done:r.done,completo:r.completo,tiempo:r.tiempo,splits:r.splits||[],juez:r.juez||jn,fin:r.fin||null});
    pinta();if(S.t0&&!S.done)corre();
  };
  const corre=()=>{clearInterval(iv);iv=setInterval(tick,250);navigator.wakeLock?.request('screen')?.catch(()=>{});};
  const tick=()=>{
    if(!S||!S.t0||S.done)return;
    const t=(Date.now()-S.t0)/1000;
    if(t>=S.p.cap)return fin(false,S.p.cap);
    const el=$('#tm');if(el)el.textContent=fmt(Math.ceil(S.p.cap-t));
  };
  const fin=(c,t)=>{clearInterval(iv);if(c&&S.splits.length<S.p.rutina.length)S.splits.push(Math.round(t*10)/10);S.fin=Date.now();S.done=true;S.completo=c;S.tiempo=Math.round(t*10)/10;guarda();pinta();};
  const toque=()=>{
    if(S.done)return;navigator.vibrate?.(25);
    S.hist.push(snap());S.reps++;S.rep++;
    if(S.reps>=tot())return fin(true,(Date.now()-S.t0)/1000);
    if(S.rep>=S.p.rutina[S.ej].reps){S.splits.push(Math.round((Date.now()-S.t0)/100)/10);S.ej++;S.rep=0;}
    guarda();pinta();
  };
  const q=(s,f)=>{const x=$(s);if(x)x.onclick=f;};
  const resumen=()=>{
    let acc=0,prev=0;
    const barras=S.p.rutina.map((e,i)=>{const hecho=Math.max(0,Math.min(e.reps,S.reps-acc));acc+=e.reps;const t=S.splits[i];const dt=t!=null?fmtD(t-prev):'—';if(t!=null)prev=t;const pct=Math.round(hecho/e.reps*100);return `<div class="bar-row"><div class="bar-head"><b>${esc(e.nombre)}</b><span>${hecho}/${e.reps} · ${dt}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join('');
    const sc=Math.round(S.reps/tot()*1000)/10,ok=S.completo;
    const C=364.4,off=(C*(1-sc/100)).toFixed(1);
    return `<div class="sum"><span class="badge${ok?'':' cap'}">${ok?'Rutina completa':'Time cap'}</span><h3>${esc(S.a.nombre)}</h3><p class="sub">${esc(S.a.cat||'Sin categoría')} · ${esc(S.p.nombre)}<br>Juez: ${esc(S.juez||'—')}${S.fin?' · '+new Date(S.fin).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):''}</p>
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 140 140"><circle class="ring-bg" cx="70" cy="70" r="58"/><circle class="ring-fg" cx="70" cy="70" r="58" stroke-dasharray="${C}" stroke-dashoffset="${off}"/><text class="ring-num" x="70" y="80">${sc}</text><text class="ring-lbl" x="70" y="102">de 100</text></svg></div>
    <div class="kp"><div><b>${S.reps}/${tot()}</b><span>repeticiones</span></div><div><b>${S.nulas}</b><span>nulas</span></div><div><b>${fmtD(S.tiempo)}</b><span>tiempo total</span></div><div><b>${Math.min(S.p.rutina.length,S.splits.length)}/${S.p.rutina.length}</b><span>ejercicios</span></div></div>
    <div class="bars">${barras}</div></div><div class="row"><button id="imp" class="sec">Imprimir / PDF</button><button id="otro">Otro atleta</button></div>`;
  };
  const pinta=()=>{
    const rut=S.p.rutina,e=rut[S.ej];
    let h=`<div class="meta"><span>${esc(S.a.nombre)} ${esc(S.a.cat||'')}</span><span>${esc(S.p.nombre)}</span></div>`;
    if(S.done)h=resumen();
    else if(!S.t0)h+=`<div class="ej">${esc(rut[0].nombre)} ${rut[0].reps}</div><p>${rut.length} ejercicios · ${tot()} reps · cap ${fmt(S.p.cap)}</p><button id="ini" class="tap" style="font-size:44px">Iniciar</button>`;
    else h+=`<div class="ej">${esc(e.nombre)}</div><div class="meta count"><span class="tm" id="tm"></span><span class="tot">${S.reps}/${tot()} reps</span></div><button id="tap" class="tap">${S.rep}<small>de ${e.reps}</small></button><div class="row"><button id="nu" class="nula">Nula (${S.nulas})</button><button id="un" class="sec">Deshacer</button><button id="te" class="sec">Terminar</button></div>`;
    $('#j').innerHTML=h;
    q('#otro',()=>{S=null;setup();});
    q('#imp',()=>print());
    q('#ini',()=>{S.t0=Date.now();guarda();corre();pinta();});
    q('#tap',toque);
    q('#nu',()=>{S.hist.push(snap());S.nulas++;guarda();pinta();});
    q('#un',()=>{const h=S.hist.pop();if(h){Object.assign(S,h);guarda();pinta();}});
    q('#te',()=>{if(confirm('¿Terminar ahora?'))fin(false,(Date.now()-S.t0)/1000);});
    tick();
  };
  D=datos(opts);
  setup();
}
</script>
</body></html>
