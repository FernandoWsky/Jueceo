<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jueceo de resistencia</title>
<style>
:root{--ink:#15212b;--paper:#f3f5f7;--card:#fff;--line:#d5dbe1;--blue:#1a5fd0;--green:#12805c;--red:#c93c32;--mut:#5b6b78}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);touch-action:manipulation}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ink);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:700}
header nav{display:flex;gap:14px;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:24px 0 8px}
input,select,textarea,button{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;margin:4px 0}
button{background:var(--blue);color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.del{width:auto;background:none;color:var(--red);padding:4px 8px;margin:0}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
ul{list-style:none;padding:0;margin:8px 0}
li{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 0}
li small{color:var(--mut);display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--mut)}
.pub td{font-size:clamp(16px,2.4vw,28px)}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42vh;background:var(--green);font-size:min(34vw,190px);line-height:1;border-radius:16px;margin:12px 0}
.tap small{font-size:20px;font-weight:500;margin-top:8px}
.ej{font-size:26px;font-weight:700;margin-top:8px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.tm{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.nula{background:var(--red)}
#net{display:none;background:#f0a500;color:#000;text-align:center;padding:6px;font-size:14px}
body.off #net{display:block}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.sum h3{margin:8px 0 0;font-size:24px}
.sum .sub{color:var(--mut);margin:2px 0 12px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;background:var(--green)}
.badge.cap{background:var(--red)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.kp div{background:var(--paper);border-radius:10px;padding:10px}
.kp b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kp span{color:var(--mut);font-size:13px}
.kp .big{grid-column:1/-1;background:var(--ink);color:#fff}
.kp .big b{font-size:44px}
.kp .big span{color:#b9c4cd}
@media print{header,button,#net{display:none}}
.blq{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;background:var(--card)}
.vta{font-size:20px;font-weight:700;color:var(--blue)}
.iso{font-size:min(15vw,96px);font-variant-numeric:tabular-nums}
.iso.run{background:#b26a00}
.iso small{font-size:18px}
td small.d{display:block;color:var(--mut);font-size:.65em}
@media(min-width:760px){.wrap{max-width:980px}.kp{grid-template-columns:repeat(4,1fr)}.tap{min-height:46vh}}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;background:var(--line)}
.av.lg{width:96px;height:96px;margin:0}
.perfil{display:flex;gap:16px;align-items:center}
p.sub{color:var(--mut);margin:2px 0}
.iso.pau{background:var(--blue)}
.row.ctl{flex-wrap:wrap}.row.ctl>*{flex:1 1 30%}
td a{color:inherit}
.err{color:var(--red)}
</style></head>
<body>
<div id="net">Sin conexión: los toques se guardan y se envían al volver la señal.</div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtD=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');
let user=null,unsub=[];
const isAdmin=()=>user&&user.email===ADMIN_EMAIL;
const net=()=>document.body.classList.toggle('off',!navigator.onLine);
addEventListener('online',net);addEventListener('offline',net);net();

const TN={cap:'Time Cap',amrap:'AMRAP',libre:'Sin tiempo'};
const bl=p=>p.bloques||[{tipo:'cap',cap:p.cap,rutina:p.rutina}];
const TT=b=>b.rutina.reduce((s,e)=>s+(e.reps||1),0);
const ptsR=(r,p)=>r.pts??Math.round(r.reps/(r.total||TT(bl(p)[r.bloque||0]))*1000)/10;
const fmtS=s=>s>=60&&s%60===0?s/60+'min':s+'s';
const fmtMs=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(ms%1000)).padStart(3,'0');
const fr=x=>Math.round(x*10)/10;
const U={s:1,sg:1,seg:1,segs:1,segundos:1,min:60,mins:60,minutos:60,m:60};
const pl=l=>{const m=l.trim().match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*([a-zA-Z]+)?$/);if(!m)return null;const n=parseFloat(m[2].replace(',','.')),u=(m[3]||'').toLowerCase();if(u&&!U[u])return null;return u?{nombre:m[1].trim(),seg:n*U[u]}:{nombre:m[1].trim(),reps:n};};
const pr=l=>{const [a,b]=l.split(/[\/|]/),e=pl(a);if(!e)return null;if(b){const c=pl(b);if(!c)return null;e.castigo=c;}return e;};
const ser=e=>e.nombre+' '+(e.reps||fmtS(e.seg))+(e.castigo?' / '+e.castigo.nombre+' '+(e.castigo.reps||fmtS(e.castigo.seg)):'');
const foto=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(i.width,i.height),z=200;c.width=c.height=z;c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,z,z);URL.revokeObjectURL(i.src);ok(c.toDataURL('image/jpeg',.7));};i.onerror=()=>no(new Error('imagen'));i.src=URL.createObjectURL(f);});
const av=(x,c)=>x?`<img class="av ${c||''}" src="${x}" alt="">`:'';
const nav=()=>`<header><a href="#/">Jueceo</a><nav>${user?'<a href="#/juez">Juzgar</a><a href="#/perfil">Perfil</a>':''}${isAdmin()?'<a href="#/admin">Admin</a>':''}<a href="#/publico">Marcador</a>${user?'<a href="#" id="out">Salir</a>':''}</nav></header>`;
const li=(t,s,c,id,ed)=>`<li><span>${esc(t)}<small>${esc(s)}</small></span><span>${ed?`<button class="del" style="color:var(--blue)" data-ed="${id}">Editar</button>`:''}<button class="del" data-c="${c}" data-id="${id}">Borrar</button></span></li>`;
document.addEventListener('click',e=>{
  if(e.target.id==='out'){e.preventDefault();auth.signOut();}
  const d=e.target.dataset;
  if(d&&d.c&&confirm('¿Borrar?'))db.collection(d.c).doc(d.id).delete();
});

function datos(cb){
  const D={p:[],a:[],r:[],j:[]};
  [['pruebas','p'],['atletas','a'],['resultados','r'],['jueces','j']].forEach(([c,k])=>unsub.push(db.collection(c).onSnapshot(s=>{
    D[k]=s.docs.map(d=>({id:d.id,...d.data()}));
    D.p.sort((x,y)=>x.creado-y.creado);D.a.sort((x,y)=>x.nombre.localeCompare(y.nombre));cb(D);
  })));
  return D;
}
const rank=rs=>rs.slice().sort((a,b)=>b.reps-a.reps||(a.tiempo??1e9)-(b.tiempo??1e9));

auth.onAuthStateChanged(u=>{user=u;route();});
addEventListener('hashchange',route);
function route(){
  unsub.forEach(f=>f());unsub=[];
  const h=location.hash||'#/';
  if(h==='#/publico')return publico();
  if(h.startsWith('#/atleta/'))return atleta(h.slice(9));
  if(!user)return login();
  if(h==='#/admin'&&isAdmin())return admin();
  if(h==='#/perfil')return perfil();
  if(h==='#/juez')return juez();
  location.hash=isAdmin()?'#/admin':'#/juez';
}

function login(){
  app.innerHTML=nav()+`<div class="wrap"><h2>Entrar como juez</h2><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button><p class="err" id="er"></p></div>`;
  $('#go').onclick=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>$('#er').textContent='Correo o contraseña incorrectos.');
}

function admin(){
  let ed=null,DD;
  app.innerHTML=nav()+`<div class="wrap">
  <h2>Atletas</h2>
  <form id="fa"><div class="row"><input name="n" placeholder="Nombre" required><input name="c" placeholder="Categoría (ej. Varonil)"></div><div class="row"><input name="l" placeholder="De dónde es"><input name="g" placeholder="Club / gym"><input name="e" type="number" min="1" placeholder="Edad"></div><textarea name="d" rows="2" placeholder="Descripción (opcional)"></textarea><input name="f" type="file" accept="image/*"><button>Guardar atleta</button><button type="button" id="cxa" class="sec" hidden>Cancelar edición</button></form>
  <ul id="la"></ul>
  <h2>Jueces</h2><ul id="lj"></ul>
  <h2>Resultados</h2><ul id="lr"></ul>
  <h2 id="ht">Nueva prueba</h2>
  <form id="fp"><input name="n" placeholder="Nombre de la prueba" required><div id="bl"></div>
  <button type="button" id="ab" class="sec">+ Agregar bloque</button><button>Guardar prueba</button><button type="button" id="cx" class="sec" hidden>Cancelar edición</button></form>
  <ul id="lp"></ul></div>`;
  const addB=b=>{const d=document.createElement('div');d.className='blq';
    d.innerHTML=`<div class="row"><select class="tp"><option value="cap">Time Cap</option><option value="amrap">AMRAP</option><option value="libre">Sin tiempo</option></select><input class="cp" type="number" min="0.5" step="0.5" placeholder="Minutos"></div><textarea rows="5" placeholder="Un ejercicio por línea:&#10;Sentadillas 20&#10;Handstand 30s | Burpees 5"></textarea><button type="button" class="del">Quitar bloque</button>`;
    const tp=d.querySelector('.tp'),cp=d.querySelector('.cp'),sh=()=>{cp.hidden=tp.value==='libre';};
    tp.onchange=sh;d.querySelector('.del').onclick=()=>{if($('#bl').children.length>1)d.remove();};
    if(b){tp.value=b.tipo;cp.value=b.cap?b.cap/60:'';d.querySelector('textarea').value=b.rutina.map(ser).join('\n');}
    sh();$('#bl').appendChild(d);};
  const reset=()=>{ed=null;$('#fp').n.value='';$('#bl').innerHTML='';addB();$('#ht').textContent='Nueva prueba';$('#cx').hidden=true;};
  reset();
  $('#ab').onclick=()=>addB();$('#cx').onclick=reset;
  DD=datos(D=>{
    $('#la').innerHTML=D.a.map(a=>li(a.nombre,[a.cat,a.club,a.lugar].filter(Boolean).join(' · ')||'Sin datos','atletas',a.id,1)).join('')||'<li>Aún no hay atletas</li>';
    $('#lj').innerHTML=D.j.map(j=>`<li><span>${av(j.foto)}${esc(j.nombre)}</span></li>`).join('')||'<li>Aún no hay perfiles de jueces</li>';
    $('#lr').innerHTML=D.r.map(r=>li(r.nombre+' · '+((D.p.find(p=>p.id===r.pruebaId)||{}).nombre||'?')+' (bloque '+((r.bloque||0)+1)+')',(r.pts??'')+' pts · '+(r.juez||'sin juez'),'resultados',r.id)).join('')||'<li>Sin resultados</li>';
    $('#lp').innerHTML=D.p.map(p=>li(p.nombre,bl(p).map(b=>TN[b.tipo]+(b.cap?' '+fmt(b.cap):'')+': '+b.rutina.map(e=>e.nombre+' '+(e.reps||fmtS(e.seg))).join(', ')).join(' | '),'pruebas',p.id,1)).join('')||'<li>Aún no hay pruebas</li>';
  });
  $('#lp').onclick=e=>{const id=e.target.dataset.ed;if(!id)return;const p=DD.p.find(x=>x.id===id);ed=id;
    $('#fp').n.value=p.nombre;$('#bl').innerHTML='';bl(p).forEach(addB);$('#ht').textContent='Editando: '+p.nombre;$('#cx').hidden=false;scrollTo(0,$('#ht').offsetTop);};
  let eda=null,fa0='';
  $('#fa').onsubmit=async e=>{e.preventDefault();const f=e.target,fl=f.f.files[0];
    const x={nombre:f.n.value.trim(),cat:f.c.value.trim(),lugar:f.l.value.trim(),club:f.g.value.trim(),edad:f.e.value?+f.e.value:null,desc:f.d.value.trim(),foto:fl?await foto(fl).catch(()=>{alert('No pude leer la foto');return fa0;}):fa0};
    if(eda)db.collection('atletas').doc(eda).set(x,{merge:true});else db.collection('atletas').add(x);
    eda=null;fa0='';f.reset();$('#cxa').hidden=true;};
  $('#cxa').onclick=()=>{eda=null;fa0='';$('#fa').reset();$('#cxa').hidden=true;};
  $('#la').onclick=e=>{const id=e.target.dataset.ed;if(!id)return;const a=DD.a.find(x=>x.id===id),f=$('#fa');eda=id;fa0=a.foto||'';
    f.n.value=a.nombre;f.c.value=a.cat||'';f.l.value=a.lugar||'';f.g.value=a.club||'';f.e.value=a.edad||'';f.d.value=a.desc||'';$('#cxa').hidden=false;scrollTo(0,0);};
  $('#fp').onsubmit=e=>{e.preventDefault();const bs=[];
    for(const d of $('#bl').children){const tipo=d.querySelector('.tp').value,cap=Math.round((+d.querySelector('.cp').value||0)*60);
      const ls=d.querySelector('textarea').value.split('\n').map(x=>x.trim()).filter(Boolean),rutina=ls.map(pr);
      if(rutina.includes(null))return alert('No entendí esta línea: '+ls[rutina.indexOf(null)]);
      if(!rutina.length||(tipo!=='libre'&&!cap))return alert('Cada bloque necesita ejercicios y, si es Time Cap o AMRAP, los minutos.');
      bs.push({tipo,cap:tipo==='libre'?0:cap,rutina});}
    const dato={nombre:e.target.n.value.trim(),bloques:bs};
    if(ed)db.collection('pruebas').doc(ed).set(dato,{merge:true});else db.collection('pruebas').add({...dato,creado:Date.now()});
    reset();};
}


function publico(){
  let sel='general',cat='',sig='';
  app.innerHTML=nav()+`<div class="wrap pub"><div class="row" id="f"></div><div id="t"></div></div>`;
  datos(D=>{
    const cats=[...new Set(D.a.map(a=>a.cat).filter(Boolean))];
    const s=JSON.stringify([D.p.map(p=>p.id),cats]);
    if(s!==sig){sig=s;
      $('#f').innerHTML=`<select id="sp"><option value="general">General (puntos)</option>${D.p.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select><select id="sc"><option value="">Todas las categorías</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
      $('#sp').value=sel;$('#sc').value=cat;
      $('#sp').onchange=e=>{sel=e.target.value;pinta(D)};$('#sc').onchange=e=>{cat=e.target.value;pinta(D)};
    }
    pinta(D);
  });
  function pinta(D){
    const rs=D.r.filter(r=>!cat||r.cat===cat);let h;const A=id=>D.a.find(a=>a.id===id)||{};
    const agg=p=>{const m={},n=bl(p).length;rs.filter(r=>r.pruebaId===p.id).forEach(r=>{const o=m[r.atletaId]=m[r.atletaId]||{id:r.atletaId,n:r.nombre,c:r.cat,s:0,t:0,nu:0,d:[]};o.s+=ptsR(r,p);o.t+=r.tiempo||0;o.nu+=r.nulas||0;if(r.det)o.d.push(r.det);});
      return Object.values(m).map(o=>({...o,pts:Math.round(o.s/n*10)/10}));};
    if(sel==='general'){
      const m={};D.p.forEach(p=>agg(p).forEach(o=>{const x=m[o.id]=m[o.id]||{id:o.id,n:o.n,c:o.c,pts:0};x.pts+=o.pts;}));
      const n=D.p.length||1;
      h='<tr><th>#</th><th>Atleta</th><th>Categoría</th><th>Puntaje</th></tr>'+Object.values(m).map(o=>({...o,pts:Math.round(o.pts/n*10)/10})).sort((a,b)=>b.pts-a.pts).map((o,i)=>`<tr><td>${i+1}</td><td>${av(A(o.id).foto)}<a href="#/atleta/${o.id}">${esc(o.n)}</a></td><td>${esc(o.c)}</td><td>${o.pts}</td></tr>`).join('');
    }else{
      const p=D.p.find(x=>x.id===sel);
      h='<tr><th>#</th><th>Atleta</th><th>Puntaje</th><th>Tiempo</th><th>Nulas</th></tr>'+(p?agg(p).sort((a,b)=>b.pts-a.pts||a.t-b.t).map((o,i)=>`<tr><td>${i+1}</td><td>${av(A(o.id).foto)}<a href="#/atleta/${o.id}">${esc(o.n)}</a><small class="d">${esc(o.d.join(' · '))}</small></td><td>${o.pts}</td><td>${fmtD(o.t)}</td><td>${o.nu}</td></tr>`).join(''):'');
    }
    $('#t').innerHTML=`<table>${h}</table>`;
  }
}

function juez(){
  app.innerHTML=nav()+`<div class="wrap" id="j"></div>`;
  let S=null,iv=null,D;
  unsub.push(()=>clearInterval(iv));
  const nb=()=>bl(S.p).length,T=()=>TT(S.b),it=()=>{const e=S.b.rutina[S.ej];return S.fase?e.castigo:e;};
  const live=()=>S.t1?S.acc+Date.now()-S.t1:S.acc;
  const cur=()=>{if(S.fase)return 0;const e=S.b.rutina[S.ej];return e.seg?Math.min(1,live()/(e.seg*1000)):S.rep;};
  const W=()=>S.vueltas*T()+S.base+cur(),pts=()=>Math.round(W()/T()*1000)/10;
  const el=()=>S.done?S.tiempo:(Date.now()-S.t0)/1000;
  const rid=()=>S.p.id+'_'+S.a.id+(S.k?'_'+S.k:'');
  const guarda=()=>db.collection('resultados').doc(rid()).set({pruebaId:S.p.id,atletaId:S.a.id,bloque:S.k,tipo:S.b.tipo,nombre:S.a.nombre,cat:S.a.cat||'',reps:Math.round(W()*100)/100,pts:pts(),nulas:S.nulas,vueltas:S.vueltas,det:S.b.tipo==='amrap'?S.vueltas+' vueltas + '+Math.round((W()-S.vueltas*T())/T()*100)+'%':'',ej:S.ej,rep:S.rep,acc:S.acc,fase:S.fase,hold:S.hold,base:S.base,t0:S.t0,done:S.done,completo:S.completo,tiempo:S.tiempo,splits:S.splits,rompe:S.rompe,juez:S.juez||'',juezUid:user.uid,total:T(),upd:Date.now(),fin:S.fin||null}).catch(e=>alert('No se pudo guardar ('+e.code+'). Solo el juez que inició este conteo puede editarlo.'));
  const snap=()=>({ej:S.ej,rep:S.rep,acc:S.acc,fase:S.fase,hold:S.hold,base:S.base,vueltas:S.vueltas,nulas:S.nulas,rompe:S.rompe,splits:S.splits.slice()});
  const opts=()=>{
    if(S)return;const sp=$('#sp'),sa=$('#sa');if(!sp)return;const a=sp.value,b=sa.value;
    sp.innerHTML=D.p.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
    sa.innerHTML=D.a.map(x=>`<option value="${x.id}">${esc(x.nombre)} ${esc(x.cat||'')}</option>`).join('');
    sp.value=a;sa.value=b;
  };
  const setup=()=>{$('#j').innerHTML=`<h2>Nuevo conteo</h2>${user.displayName?`<p>Juez: ${esc(user.displayName)}</p>`:'<input id="jn" placeholder="Tu nombre (juez)">'}<select id="sp"></select><select id="sa"></select><button id="pre">Preparar</button>`;opts();$('#pre').onclick=prep;};
  const load=(p,a,k,jn)=>{
    const r=D.r.find(x=>x.id===p.id+'_'+a.id+(k?'_'+k:''));
    S={p,a,k,b:bl(p)[k],ej:0,rep:0,acc:0,fase:0,hold:0,base:0,vueltas:0,nulas:0,rompe:0,t0:null,t1:null,done:false,completo:false,tiempo:null,splits:[],hist:[],juez:jn,juezUid:user.uid,fin:null};
    if(r)Object.assign(S,{ej:r.ej,rep:r.rep,acc:r.acc||0,fase:r.fase||0,hold:r.hold||0,base:r.base||0,vueltas:r.vueltas||0,nulas:r.nulas||0,rompe:r.rompe||0,t0:r.t0,done:r.done,completo:r.completo,tiempo:r.tiempo,splits:r.splits||[],juez:r.juez||jn,juezUid:r.juezUid||user.uid,fin:r.fin||null});
    pinta();if(S.t0&&!S.done)corre();
  };
  const prep=()=>{
    const p=D.p.find(x=>x.id===$('#sp').value),a=D.a.find(x=>x.id===$('#sa').value);if(!p||!a)return;
    let jn=user.displayName;if(!jn){jn=($('#jn')?.value||'').trim();if(!jn)return alert('Escribe tu nombre de juez.');user.updateProfile({displayName:jn});db.collection('jueces').doc(user.uid).set({nombre:jn},{merge:true});}
    const n=bl(p).length;let k=0;
    while(k<n&&D.r.find(x=>x.id===p.id+'_'+a.id+(k?'_'+k:'')&&x.done))k++;
    load(p,a,Math.min(k,n-1),jn);
  };
  const corre=()=>{clearInterval(iv);iv=setInterval(tick,50);navigator.wakeLock?.request('screen')?.catch(()=>{});};
  const fin=(c,t)=>{
    if(S.t1){S.acc+=Date.now()-S.t1;S.t1=null;}
    if(S.fase){const e=S.b.rutina[S.ej];S.base+=e.seg?S.hold/(e.seg*1000):S.hold;S.fase=0;S.acc=0;S.rep=0;}
    clearInterval(iv);S.done=true;S.completo=c;S.tiempo=Math.round(t*10)/10;S.fin=Date.now();guarda();pinta();
  };
  const back=()=>{const m=S.b.rutina[S.ej];S.fase=0;S.rep=m.seg?0:S.hold;S.acc=m.seg?S.hold:0;};
  const adv=w=>{
    S.base+=w;if(S.b.tipo!=='amrap')S.splits.push(Math.round(el()*10)/10);
    S.rep=0;S.acc=0;S.hold=0;S.fase=0;S.ej++;
    if(S.ej>=S.b.rutina.length){if(S.b.tipo==='amrap'){S.vueltas++;S.ej=0;S.base=0;}else{S.ej--;return fin(true,el());}}
    guarda();pinta();
  };
  const isoStop=auto=>{
    const e=it(),m=e.seg*1000;S.hist.push(snap());
    S.acc=auto?m:S.acc+Date.now()-S.t1;S.t1=null;
    if(S.acc>=m){if(S.fase){back();guarda();pinta();}else adv(1);return;}
    if(S.fase){S.acc=0;guarda();pinta();return;}
    S.rompe++;
    if(e.castigo){S.hold=S.acc;S.fase=1;S.rep=0;S.acc=0;guarda();pinta();}else{guarda();pinta();}
  };
  const toque=()=>{
    if(S.done)return;navigator.vibrate?.(25);S.hist.push(snap());S.rep++;const e=it();
    if(S.rep>=e.reps){if(S.fase){back();guarda();pinta();}else adv(e.reps);}
    else{guarda();pinta();}
  };
  const tick=()=>{
    if(!S||!S.t0||S.done)return;const t=el(),b=S.b;
    if(b.tipo!=='libre'&&t>=b.cap)return fin(false,b.cap);
    const x=$('#tm');if(x)x.textContent=b.tipo==='libre'?fmt(t):fmt(Math.ceil(b.cap-t));
    const e=it();
    if(e&&e.seg){
      if(S.t1&&live()>=e.seg*1000)return isoStop(true);
      const o=$('#isot');if(o){o.textContent=fmtMs(S.t1||S.acc?live():e.seg*1000);$('#isol').textContent=S.t1?'Toca para cortar':S.acc?'Pausado · toca para reanudar':'Meta · toca para iniciar';$('#iso').classList.toggle('run',!!S.t1);$('#iso').classList.toggle('pau',!S.t1&&S.acc>0);}
    }
  };
  const resumen=()=>{
    const w=W(),amr=S.b.tipo==='amrap';let acc=0,prev=0;
    const filas=amr?'':S.b.rutina.map((e,i)=>{const u=e.reps||1,h=Math.max(0,Math.min(u,w-acc));acc+=u;const t=S.splits[i];const dt=t!=null?fmtD(t-prev):'—';if(t!=null)prev=t;
      return `<tr><td>${esc(e.nombre)}</td><td>${e.seg?fmtD(h*e.seg)+' / '+fmtS(e.seg):fr(h)+'/'+e.reps}</td><td>${dt}</td></tr>`;}).join('');
    const vi=Math.round((w-S.vueltas*T())/T()*100);
    return `<div class="sum"><span class="badge${S.completo?'':' cap'}">${S.completo?'Rutina completa':'Time cap / terminada'}</span><div class="perfil">${av(S.a.foto,'lg')}<div><h3>${esc(S.a.nombre)}</h3><p class="sub">${esc(S.a.cat||'Sin categoría')} · ${esc(S.p.nombre)} · Bloque ${S.k+1}/${nb()} (${TN[S.b.tipo]})<br>Juez: ${av(((D.j||[]).find(x=>x.id===S.juezUid)||{}).foto)}${esc(S.juez||'—')}${S.fin?' · '+new Date(S.fin).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):''}</p></div></div>
    <div class="kp"><div class="big"><b>${pts()}</b><span>puntaje (100 = una rutina completa)</span></div><div><b>${amr?S.vueltas:fr(w)+'/'+T()}</b><span>${amr?'vueltas completas':'repeticiones'}</span></div><div><b>${S.nulas}</b><span>nulas</span></div><div><b>${fmtD(S.tiempo)}</b><span>tiempo total</span></div><div><b>${amr?vi+'%':S.rompe}</b><span>${amr?'de la vuelta en curso':'rupturas'}</span></div></div>
    ${amr?'':`<table><tr><th>Ejercicio</th><th>Logrado</th><th>Tiempo</th></tr>${filas}</table>`}</div><div class="row"><button id="imp" class="sec">Imprimir / PDF</button>${S.k+1<nb()?'<button id="sig">Siguiente bloque</button>':''}<button id="otro">Otro atleta</button></div>`;
  };
  const pinta=()=>{
    let h=`<div class="meta"><span>${esc(S.a.nombre)} ${esc(S.a.cat||'')}</span><span>${esc(S.p.nombre)} · Bloque ${S.k+1}/${nb()} · ${TN[S.b.tipo]}</span></div>`;
    if(S.done)h=resumen();
    else if(!S.t0)h+=`<p>${S.b.rutina.map(e=>esc(e.nombre)+' '+(e.reps||fmtS(e.seg))).join(' · ')}</p><p>${TN[S.b.tipo]}${S.b.cap?' · '+fmt(S.b.cap):''}</p><button id="ini" class="tap" style="font-size:44px">Iniciar</button>`;
    else{
      const e=it();
      h+=`${S.b.tipo==='amrap'?`<div class="vta">Vuelta ${S.vueltas+1}</div>`:''}${S.fase?'<span class="badge cap">Castigo</span>':''}<div class="ej">${esc(e.nombre)} ${e.reps?'':fmtS(e.seg)}</div><div class="meta"><span class="tm" id="tm"></span><span>${fr(W())}/${T()}</span></div>`;
      h+=e.seg?`<button id="iso" class="tap iso"><span id="isot"></span><small id="isol"></small></button>`:`<button id="tap" class="tap">${S.rep}<small>de ${e.reps}</small></button>`;
      h+=`<div class="row ctl"><button id="nu" class="nula">Nula (${S.nulas})</button>${!S.fase&&e.reps&&e.castigo?'<button id="ro" style="background:#b26a00">Rompió</button>':''}<button id="un" class="sec">Deshacer</button>${S.fase?'':'<button id="sk" class="sec">Saltar</button>'}<button id="te" class="sec">Terminar</button></div>`;
    }
    $('#j').innerHTML=h;
    const q=(s,f)=>{const x=$(s);if(x)x.onclick=f;};
    q('#otro',()=>{S=null;setup();});
    q('#sig',()=>load(S.p,S.a,S.k+1,S.juez));
    q('#imp',()=>print());
    q('#ini',()=>{S.t0=Date.now();guarda();corre();pinta();});
    q('#tap',toque);
    q('#iso',()=>{if(S.t1)isoStop(false);else{S.t1=Date.now();pinta();}});
    q('#nu',()=>{S.hist.push(snap());S.nulas++;guarda();pinta();});
    q('#ro',()=>{S.hist.push(snap());S.rompe++;S.hold=S.rep;S.fase=1;S.rep=0;S.acc=0;guarda();pinta();});
    q('#sk',()=>{if(!confirm('¿Saltar este ejercicio con lo logrado?'))return;S.hist.push(snap());if(S.t1){S.acc+=Date.now()-S.t1;S.t1=null;}adv(cur());});
    q('#un',()=>{if(S.t1)return;const x=S.hist.pop();if(x){Object.assign(S,x);guarda();pinta();}});
    q('#te',()=>{if(confirm('¿Terminar ahora?'))fin(false,el());});
    tick();
  };
  D=datos(opts);
  setup();
}
function atleta(id){
  app.innerHTML=nav()+`<div class="wrap" id="pf"></div>`;
  datos(D=>{const a=D.a.find(x=>x.id===id);if(!a){$('#pf').innerHTML='<p>Cargando atleta…</p>';return;}
    const rs=D.r.filter(r=>r.atletaId===id).map(r=>({r,p:D.p.find(x=>x.id===r.pruebaId)})).filter(x=>x.p);
    $('#pf').innerHTML=`<div class="perfil">${av(a.foto,'lg')}<div><h2 style="margin:0">${esc(a.nombre)}</h2><p class="sub">${esc([a.cat,a.club,a.lugar,a.edad?a.edad+' años':''].filter(Boolean).join(' · '))}</p></div></div>${a.desc?`<p>${esc(a.desc)}</p>`:''}<h2>Resultados</h2><table><tr><th>Prueba</th><th>Puntaje</th><th>Tiempo</th><th>Nulas</th><th>Juez</th></tr>${rs.map(({r,p})=>`<tr><td>${esc(p.nombre)}${bl(p).length>1?' · B'+((r.bloque||0)+1):''}<small class="d">${esc(r.det||'')}</small></td><td>${ptsR(r,p)}</td><td>${r.done?fmtD(r.tiempo):'En curso'}</td><td>${r.nulas||0}</td><td>${esc(r.juez||'')}</td></tr>`).join('')}</table>`;});
}
function perfil(){
  app.innerHTML=nav()+`<div class="wrap"><h2>Mi perfil de juez</h2><div id="pv"></div><input id="pn" placeholder="Tu nombre" value="${esc(user.displayName||'')}"><input id="pi" type="file" accept="image/*"><button id="gp">Guardar</button></div>`;
  let ft='';
  datos(D=>{const m=D.j.find(x=>x.id===user.uid)||{};if(!ft)ft=m.foto||'';$('#pv').innerHTML=av(ft,'lg');});
  $('#gp').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return alert('Escribe tu nombre.');const f=$('#pi').files[0];
    if(f)ft=await foto(f).catch(()=>{alert('No pude leer la foto');return ft;});
    user.updateProfile({displayName:n});db.collection('jueces').doc(user.uid).set({nombre:n,foto:ft});alert('Guardado');};
}
</script>
